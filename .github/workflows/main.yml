name: Build Smart Wallet APK

'on':
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Smart Wallet Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Generate Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/mywallet/smartbudget
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          # 1. settings.gradle
          cat << 'END_SETTINGS' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SmartWallet"
          include ':app'
          END_SETTINGS

          # 2. build.gradle
          cat << 'END_BUILD' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          END_BUILD

          # 3. app/build.gradle
          cat << 'END_APP_BUILD' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mywallet.smartbudget'
              compileSdk 34

              defaultConfig {
                  applicationId "com.mywallet.smartbudget"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          END_APP_BUILD

          # 4. AndroidManifest.xml
          cat << 'END_MANIFEST' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          END_MANIFEST

          # 5. strings.xml
          cat << 'END_STRINGS' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">محفظتي الذكية</string>
          </resources>
          END_STRINGS

          # 6. MainActivity.java
          cat << 'END_JAVA' > app/src/main/java/com/mywallet/smartbudget/MainActivity.java
          package com.mywallet.smartbudget;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JsResult;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      Window window = getWindow();
                      window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                      window.setStatusBarColor(Color.parseColor("#070d18"));
                  }

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onJsAlert(WebView view, String url, String message, final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setTitle("محفظتي الذكية")
                              .setMessage(message)
                              .setPositiveButton(android.R.string.ok, (dialog, which) -> result.confirm())
                              .setCancelable(false)
                              .create()
                              .show();
                          return true;
                      }

                      @Override
                      public boolean onJsConfirm(WebView view, String url, String message, final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setTitle("تأكيد الإجراء")
                              .setMessage(message)
                              .setPositiveButton("نعم", (dialog, which) -> result.confirm())
                              .setNegativeButton("إلغاء", (dialog, which) -> result.cancel())
                              .setCancelable(false)
                              .create()
                              .show();
                          return true;
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          END_JAVA

      - name: Generate App Icons
        run: |
          cat << 'EOF' > make_icons.py
          import zlib, struct, os

          def make_wallet_icon(size):
              raw = bytearray()
              cx, cy = size / 2.0, size / 2.0
              r = size / 2.0 - 2
              for y in range(size):
                  raw.append(0)
                  for x in range(size):
                      dx = x - cx
                      dy = y - cy
                      dist = (dx*dx + dy*dy)**0.5
                      if dist > r:
                          raw.extend([0, 0, 0, 0])
                          continue
                      bg_r = int(7 + (y / size) * 10)
                      bg_g = int(14 + (y / size) * 18)
                      bg_b = int(24 + (y / size) * 26)

                      if dist >= r - 3:
                          raw.extend([16, 185, 129, 255])
                          continue
                      elif dist >= r - 6:
                          raw.extend([245, 158, 11, 200])
                          continue

                      wx = (x - (cx - size * 0.02)) / (size * 0.28)
                      wy = (y - cy) / (size * 0.22)
                      in_wallet = (abs(wx) <= 1.0 and abs(wy) <= 1.0)
                      if in_wallet:
                          is_clasp = (wx >= 0.4 and abs(wy) <= 0.4)
                          is_edge = (abs(wx) >= 0.9 or abs(wy) >= 0.9)
                          if is_clasp:
                              raw.extend([245, 158, 11, 255])
                          elif is_edge:
                              raw.extend([16, 185, 129, 255])
                          else:
                              raw.extend([15, 45, 38, 255])
                      else:
                          raw.extend([bg_r, bg_g, bg_b, 255])

              comp = zlib.compress(bytes(raw))
              png = bytearray(b'\x89PNG\r\n\x1a\n')
              ihdr = struct.pack('>IIBBBBB', size, size, 8, 6, 0, 0, 0)
              png.extend(struct.pack('>I', 13) + b'IHDR' + ihdr + struct.pack('>I', zlib.crc32(b'IHDR' + ihdr)))
              png.extend(struct.pack('>I', len(comp)) + b'IDAT' + comp + struct.pack('>I', zlib.crc32(b'IDAT' + comp)))
              png.extend(struct.pack('>I', 0) + b'IEND' + struct.pack('>I', zlib.crc32(b'IEND')))
              return bytes(png)

          densities = [('mipmap-mdpi', 48), ('mipmap-hdpi', 72), ('mipmap-xhdpi', 96), ('mipmap-xxhdpi', 144)]
          for folder, s in densities:
              path = f'app/src/main/res/{folder}'
              os.makedirs(path, exist_ok=True)
              with open(f'{path}/ic_launcher.png', 'wb') as f:
                  f.write(make_wallet_icon(s))
          EOF
          python3 make_icons.py
          rm make_icons.py

      - name: Embed Ultra-Modern Smart Wallet HTML App
        run: |
          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>محفظتي الذكية</title>
              <style>
                  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
                  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
                  body { background: radial-gradient(circle at 50% 0%, #0d1a2d 0%, #070d18 100%); color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px 14px 20px; user-select: none; }
                  .container { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 14px; }

                  /* Header */
                  .app-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 2px 4px; }
                  .header-brand { display: flex; align-items: center; gap: 10px; }
                  .brand-avatar { width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4); border: 1px solid rgba(255, 255, 255, 0.15); }
                  .brand-title { font-size: 19px; font-weight: 900; color: #fff; letter-spacing: -0.3px; line-height: 1.2; }
                  .brand-subtitle { font-size: 11px; color: #94a3b8; font-weight: 600; }

                  /* Segmented Modern Navigation */
                  .nav-segments { display: flex; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); padding: 5px; border-radius: 16px; gap: 4px; border: 1px solid rgba(255, 255, 255, 0.06); }
                  .seg-btn { flex: 1; background: none; border: none; padding: 8px 12px; border-radius: 12px; color: #94a3b8; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.25s; display: flex; align-items: center; justify-content: center; gap: 5px; }
                  .seg-btn.active { background: linear-gradient(135deg, #10b981 0%, #047857 100%); color: #fff; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35); }

                  /* Modern Hero Balance Card */
                  .hero-balance { background: linear-gradient(145deg, #0e2722 0%, #0a1916 100%); border: 1px solid rgba(16, 185, 129, 0.35); border-radius: 24px; padding: 22px; box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.15); position: relative; overflow: hidden; }
                  .hero-balance::after { content: ''; position: absolute; top: -40px; right: -40px; width: 140px; height: 140px; background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, transparent 70%); border-radius: 50%; pointer-events: none; }
                  .hero-label { font-size: 13px; color: #a7f3d0; font-weight: 700; display: flex; align-items: center; gap: 6px; }
                  .hero-amount { font-size: 38px; font-weight: 900; color: #10b981; margin: 6px 0 16px; text-shadow: 0 0 25px rgba(16, 185, 129, 0.4); display: flex; align-items: baseline; gap: 8px; }
                  .hero-currency { font-size: 16px; font-weight: 700; color: #6ee7b7; }
                  .hero-stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
                  .stat-pill { background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
                  .stat-pill-label { font-size: 11px; color: #94a3b8; font-weight: 700; }
                  .stat-pill-in { font-size: 18px; font-weight: 900; color: #34d399; }
                  .stat-pill-out { font-size: 18px; font-weight: 900; color: #f87171; }

                  /* Modern Budget Card */
                  .budget-box { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
                  .budget-meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 800; }
                  .budget-meta-title { color: #e2e8f0; display: flex; align-items: center; gap: 6px; }
                  .budget-badge { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 800; }
                  .progress-rail { width: 100%; height: 9px; background: #1e293b; border-radius: 8px; overflow: hidden; position: relative; }
                  .progress-bar-fill { height: 100%; border-radius: 8px; transition: width 0.4s ease-out; }
                  .budget-alert-pill { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; font-size: 11px; font-weight: 800; padding: 6px 10px; border-radius: 10px; display: flex; align-items: center; gap: 6px; }

                  /* Action Button */
                  .primary-fab { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #fff; border: none; padding: 16px 20px; border-radius: 18px; font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; box-shadow: 0 8px 24px -4px rgba(16, 185, 129, 0.45); transition: 0.2s; width: 100%; }
                  .primary-fab:active { transform: scale(0.98); }

                  /* Transactions List */
                  .list-header { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
                  .list-title { font-size: 15px; font-weight: 900; color: #f8fafc; }
                  .filter-chips { display: flex; gap: 6px; background: rgba(15, 23, 42, 0.6); padding: 4px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); }
                  .f-chip { background: none; border: none; color: #94a3b8; padding: 5px 12px; border-radius: 9px; font-size: 11px; font-weight: 800; cursor: pointer; transition: 0.2s; }
                  .f-chip.active { background: #1e293b; color: #38bdf8; }
                  .tx-cards-container { display: flex; flex-direction: column; gap: 10px; }
                  .tx-card { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 16px; padding: 13px 15px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
                  .tx-right { display: flex; align-items: center; gap: 12px; }
                  .tx-icon-bubble { width: 44px; height: 44px; border-radius: 14px; background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.06); display: flex; align-items: center; justify-content: center; font-size: 20px; }
                  .tx-meta { display: flex; flex-direction: column; gap: 2px; }
                  .tx-name { font-size: 14px; font-weight: 800; color: #fff; }
                  .tx-subtext { font-size: 11px; color: #64748b; font-weight: 600; }
                  .tx-left { display: flex; align-items: center; gap: 10px; }
                  .tx-val { font-size: 16px; font-weight: 900; }
                  .tx-green { color: #34d399; }
                  .tx-red { color: #f87171; }
                  .tx-del-btn { background: none; border: none; color: #475569; font-size: 15px; cursor: pointer; padding: 4px; transition: 0.2s; }
                  .tx-del-btn:hover { color: #f43f5e; }

                  /* Designer Badge in Footer */
                  .footer-designer { margin-top: 10px; display: flex; justify-content: center; padding: 8px; }
                  .designer-btn { background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.8) 100%); border: 1px solid rgba(251, 191, 36, 0.35); border-radius: 14px; padding: 10px 18px; color: #fbbf24; font-size: 13px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); transition: 0.25s; }
                  .designer-btn:active { transform: scale(0.96); }

                  /* Modal */
                  .modal-layer { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
                  .dialog-card { background: #0f172a; width: 100%; max-width: 360px; border-radius: 24px; border: 1px solid rgba(251, 191, 36, 0.4); padding: 24px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 25px rgba(251, 191, 36, 0.15); animation: zoomIn 0.2s ease-out; }
                  .dialog-avatar { width: 68px; height: 68px; border-radius: 22px; background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); display: flex; align-items: center; justify-content: center; font-size: 34px; box-shadow: 0 8px 24px rgba(217, 119, 6, 0.4); }
                  .dialog-title { font-size: 17px; font-weight: 900; color: #fff; }
                  .dialog-text { font-size: 14px; font-weight: 700; color: #cbd5e1; line-height: 1.6; padding: 4px; }
                  .dialog-close-btn { width: 100%; background: linear-gradient(135deg, #d97706 0%, #b45309 100%); color: #fff; border: none; padding: 12px; border-radius: 14px; font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(217, 119, 6, 0.35); }

                  /* Form Modal */
                  .form-sheet-layer { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: none; align-items: flex-end; justify-content: center; z-index: 150; }
                  .form-sheet { background: #0f172a; width: 100%; max-width: 460px; border-radius: 28px 28px 0 0; border-top: 1px solid rgba(255, 255, 255, 0.12); max-height: 90vh; overflow-y: auto; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; }
                  .type-switch { display: grid; grid-template-columns: 1fr 1fr; background: #1e293b; border-radius: 14px; padding: 4px; gap: 4px; }
                  .t-btn { background: none; border: none; padding: 10px; border-radius: 11px; color: #94a3b8; font-weight: 800; font-size: 14px; cursor: pointer; transition: 0.2s; }
                  .t-btn.active-exp { background: #ef4444; color: #fff; }
                  .t-btn.active-inc { background: #10b981; color: #fff; }
                  .modern-inp { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 13px; color: #fff; font-size: 15px; outline: none; }
                  .modern-inp:focus { border-color: #10b981; }
                  .presets-row { display: flex; gap: 6px; }
                  .p-chip { flex: 1; background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.06); color: #cbd5e1; padding: 7px; border-radius: 10px; font-size: 12px; font-weight: 800; cursor: pointer; }
                  .cat-matrix { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
                  .cat-tile { background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-size: 11px; font-weight: 700; color: #cbd5e1; text-align: center; }
                  .cat-tile.selected { border-color: #10b981; background: rgba(16, 185, 129, 0.18); color: #10b981; }
                  .cat-tile span:first-child { font-size: 22px; }

                  .hidden { display: none !important; }
                  @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
              </style>
          </head>
          <body>

              <div class="container">
                  <!-- Header -->
                  <div class="app-header">
                      <div class="header-brand">
                          <div class="brand-avatar">💰</div>
                          <div>
                              <div class="brand-title">محفظتي الذكية</div>
                              <div class="brand-subtitle">الإدارة المالية والميزانية المباشرة</div>
                          </div>
                      </div>
                  </div>

                  <!-- Navigation Bar -->
                  <div class="nav-segments">
                      <button id="seg-dash" class="seg-btn active" onclick="switchNav('dash')">🏠 الرئيسية</button>
                      <button id="seg-reports" class="seg-btn" onclick="switchNav('reports')">📊 التقارير</button>
                      <button id="seg-settings" class="seg-btn" onclick="switchNav('settings')">⚙️ الإعدادات</button>
                  </div>

                  <!-- Tab 1: Dashboard -->
                  <div id="tab-dash" class="tab-pane" style="display:flex; flex-direction:column; gap:14px;">
                      <!-- Hero Balance Card -->
                      <div class="hero-balance">
                          <span class="hero-label">💎 الرصيد الصافي المتبقي</span>
                          <div class="hero-amount">
                              <span id="txt-balance">0</span>
                              <span id="txt-curr1" class="hero-currency">ر.ي</span>
                          </div>
                          <div class="hero-stats-row">
                              <div class="stat-pill">
                                  <span class="stat-pill-label">🟢 إجمالي الدخل</span>
                                  <span id="txt-income" class="stat-pill-in">+0</span>
                              </div>
                              <div class="stat-pill">
                                  <span class="stat-pill-label">🔴 إجمالي المصاريف</span>
                                  <span id="txt-expense" class="stat-pill-out">-0</span>
                              </div>
                          </div>
                      </div>

                      <!-- Monthly Budget Bar -->
                      <div class="budget-box">
                          <div class="budget-meta">
                              <span class="budget-meta-title">🎯 الميزانية: <span id="txt-budget-limit" style="color:#fff;">0</span> <span id="txt-curr2">ر.ي</span></span>
                              <span id="txt-budget-pct" class="budget-badge">0% مستهلك</span>
                          </div>
                          <div class="progress-rail">
                              <div id="bar-budget" class="progress-bar-fill" style="width: 0%; background: #10b981;"></div>
                          </div>
                          <div id="box-budget-warn" class="budget-alert-pill hidden">⚠️ تنبيه: تجاوزت 85% من الميزانية المحددة!</div>
                      </div>

                      <!-- Quick Add Action Button -->
                      <button class="primary-fab" onclick="openAddModal()">
                          <span>➕ تسجيل حركة مالية جديدة</span>
                      </button>

                      <!-- Filter & Transactions List -->
                      <div class="list-header">
                          <span class="list-title">سجل العمليات</span>
                          <div class="filter-chips">
                              <button class="f-chip active" onclick="setFilter('all', this)">الكل</button>
                              <button class="f-chip" onclick="setFilter('expense', this)">مصاريف</button>
                              <button class="f-chip" onclick="setFilter('income', this)">دخل</button>
                          </div>
                      </div>
                      <div id="tx-cards-container" class="tx-cards-container"></div>
                  </div>

                  <!-- Tab 2: Reports -->
                  <div id="tab-reports" class="tab-pane hidden" style="flex-direction:column; gap:14px;">
                      <span class="list-title">📊 تحليل توزيع المصاريف حسب الفئات</span>
                      <div id="reports-categories-list" style="display:flex; flex-direction:column; gap:12px;"></div>
                  </div>

                  <!-- Tab 3: Settings -->
                  <div id="tab-settings" class="tab-pane hidden" style="flex-direction:column; gap:14px;">
                      <div class="budget-box">
                          <span class="list-title">⚙️ تخصيص العملة والميزانية</span>
                          <div style="margin-top:10px; display:flex; flex-direction:column; gap:12px;">
                              <div>
                                  <label style="font-size:12px; color:#94a3b8; display:block; margin-bottom:5px; font-weight:700;">العملة الرئيسية:</label>
                                  <select id="sel-currency" class="modern-inp" onchange="updateCurrency(this.value)">
                                      <option value="ر.ي">ريال يمني (ر.ي)</option>
                                      <option value="ر.س">ريال سعودي (ر.س)</option>
                                      <option value="د.إ">درهم إماراتي (د.إ)</option>
                                      <option value="ج.م">جنيه مصري (ج.م)</option>
                                      <option value="د.ك">دينار كويتي (د.ك)</option>
                                      <option value="د.أ">دينار أردني (د.أ)</option>
                                      <option value="ر.ع">ريال عماني (ر.ع)</option>
                                      <option value="ر.ق">ريال قطري (ر.ق)</option>
                                      <option value="$">دولار أمريكي ($)</option>
                                      <option value="€">يورو (€)</option>
                                  </select>
                              </div>
                              <div>
                                  <label style="font-size:12px; color:#94a3b8; display:block; margin-bottom:5px; font-weight:700;">الميزانية الشهرية المحددة:</label>
                                  <input type="number" id="inp-budget-target" class="modern-inp" placeholder="مثال: 250000" onchange="updateBudgetLimit(this.value)">
                              </div>
                          </div>
                      </div>

                      <div class="budget-box">
                          <span class="list-title">💾 إدارة البيانات</span>
                          <div style="margin-top:10px; display:flex; flex-direction:column; gap:10px;">
                              <button class="primary-fab" style="background:#1e293b; border:1px solid #334155; font-size:14px;" onclick="exportDataReport()">
                                  📋 نسخ كشف الحساب كاملاً (نصي)
                              </button>
                              <button class="primary-fab" style="background:#7f1d1d; border:1px solid #dc2626; font-size:14px;" onclick="clearAllData()">
                                  🗑️ مسح كافة الحركات والبدء من جديد
                              </button>
                          </div>
                      </div>
                  </div>

                  <!-- Designer Footer Badge -->
                  <div class="footer-designer">
                      <button class="designer-btn" onclick="openDesignerModal()">
                          <span>👑</span>
                          <span>حول المصمم</span>
                      </button>
                  </div>
              </div>

              <!-- About Designer Modal -->
              <div id="designer-modal" class="modal-layer" onclick="closeDesignerModal(event)">
                  <div class="dialog-card" onclick="event.stopPropagation()">
                      <div class="dialog-avatar">👑</div>
                      <div class="dialog-title">بطاقة المطور والمصمم</div>
                      <div class="dialog-text">
                          تم تصميم البرنامج بكل فخر من قبل المصمم والمبرمج : عمار الهلالي أبو أسد
                      </div>
                      <button class="dialog-close-btn" onclick="closeDesignerModal()">إغلاق</button>
                  </div>
              </div>

              <!-- Add Transaction Sheet -->
              <div id="add-modal" class="form-sheet-layer" onclick="closeAddModal(event)">
                  <div class="form-sheet" onclick="event.stopPropagation()">
                      <div style="display:flex; justify-content:space-between; align-items:center;">
                          <span style="font-size:17px; font-weight:900; color:#fff;">تسجيل حركة مالية جديدة</span>
                          <button onclick="closeAddModal()" style="background:none; border:none; color:#94a3b8; font-size:22px; cursor:pointer;">✕</button>
                      </div>

                      <div class="type-switch">
                          <button id="btn-type-exp" class="t-btn active-exp" onclick="setType('expense')">🔴 مصروف</button>
                          <button id="btn-type-inc" class="t-btn" onclick="setType('income')">🟢 دخل</button>
                      </div>

                      <div>
                          <input type="number" id="tx-amount" class="modern-inp" style="font-size:26px; font-weight:900; text-align:center; color:#10b981;" placeholder="0" step="1">
                          <div class="presets-row" style="margin-top:8px;">
                              <button class="p-chip" onclick="addPreset(500)">+500</button>
                              <button class="p-chip" onclick="addPreset(1000)">+1,000</button>
                              <button class="p-chip" onclick="addPreset(5000)">+5,000</button>
                              <button class="p-chip" onclick="addPreset(10000)">+10,000</button>
                          </div>
                      </div>

                      <div>
                          <label style="font-size:12px; color:#94a3b8; display:block; margin-bottom:6px; font-weight:800;">اختر الفئة المناسبة:</label>
                          <div id="cats-matrix" class="cat-matrix"></div>
                      </div>

                      <input type="text" id="tx-notes" class="modern-inp" placeholder="ملاحظات أو اسم المتجر (اختياري)">

                      <button class="primary-fab" onclick="saveTransaction()">
                          💾 حفظ المعاملة في المحفظة
                      </button>
                  </div>
              </div>

              <script>
                  function formatMoney(val) {
                      const num = Math.round(Number(val) || 0);
                      return num.toLocaleString('en-US');
                  }

                  const expenseCategories = [
                      { id: 'food', name: 'مطاعم وطعام', icon: '🍔' },
                      { id: 'groceries', name: 'سوبرماركت', icon: '🛒' },
                      { id: 'fuel', name: 'وقود ومواصلات', icon: '⛽' },
                      { id: 'bills', name: 'فواتير وخدمات', icon: '💡' },
                      { id: 'shopping', name: 'تسوق وملابس', icon: '🛍️' },
                      { id: 'health', name: 'صحة وصيدلية', icon: '💊' },
                      { id: 'education', name: 'تعليم ودورات', icon: '🎓' },
                      { id: 'travel', name: 'سفر وسياحة', icon: '✈️' },
                      { id: 'fun', name: 'ترفيه وهدايا', icon: '🎁' },
                      { id: 'other_exp', name: 'مصاريف أخرى', icon: '📦' }
                  ];

                  const incomeCategories = [
                      { id: 'salary', name: 'راتب شهري', icon: '💼' },
                      { id: 'investment', name: 'أرباح وتجارة', icon: '📈' },
                      { id: 'bonus', name: 'مكافأة وهدية', icon: '🎁' },
                      { id: 'freelance', name: 'دخل إضافي', icon: '💰' }
                  ];

                  let currentType = 'expense';
                  let selectedCatId = 'food';
                  let currentFilter = 'all';

                  let appData = JSON.parse(localStorage.getItem('mywallet_data')) || {
                      currency: 'ر.ي',
                      monthlyBudget: 250000,
                      transactions: [
                          { id: 1, type: 'income', amount: 350000, catId: 'salary', catName: 'راتب شهري', icon: '💼', notes: 'راتب هذا الشهر', date: '2025-01-01' },
                          { id: 2, type: 'expense', amount: 15000, catId: 'groceries', catName: 'سوبرماركت', icon: '🛒', notes: 'مشتريات منزلية', date: '2025-01-02' },
                          { id: 3, type: 'expense', amount: 8000, catId: 'fuel', catName: 'وقود ومواصلات', icon: '⛽', notes: 'بنزين السيارة', date: '2025-01-03' }
                      ]
                  };

                  function saveData() {
                      localStorage.setItem('mywallet_data', JSON.stringify(appData));
                      renderAll();
                  }

                  function renderAll() {
                      document.getElementById('sel-currency').value = appData.currency;
                      document.getElementById('inp-budget-target').value = Math.round(appData.monthlyBudget);
                      document.getElementById('txt-curr1').innerText = appData.currency;
                      document.getElementById('txt-curr2').innerText = appData.currency;
                      document.getElementById('txt-budget-limit').innerText = formatMoney(appData.monthlyBudget);

                      let totalIn = 0;
                      let totalOut = 0;

                      appData.transactions.forEach(t => {
                          if (t.type === 'income') totalIn += Math.round(t.amount);
                          else totalOut += Math.round(t.amount);
                      });

                      const balance = totalIn - totalOut;
                      document.getElementById('txt-balance').innerText = formatMoney(balance);
                      document.getElementById('txt-income').innerText = '+' + formatMoney(totalIn);
                      document.getElementById('txt-expense').innerText = '-' + formatMoney(totalOut);

                      // Budget Calculation
                      const budget = appData.monthlyBudget || 1;
                      const pct = Math.min(Math.round((totalOut / budget) * 100), 100);
                      document.getElementById('txt-budget-pct').innerText = `${pct}% مستهلك`;
                      const bar = document.getElementById('bar-budget');
                      bar.style.width = pct + '%';

                      const warn = document.getElementById('box-budget-warn');
                      if (pct >= 85) {
                          bar.style.background = '#ef4444';
                          warn.classList.remove('hidden');
                      } else if (pct >= 65) {
                          bar.style.background = '#f59e0b';
                          warn.classList.add('hidden');
                      } else {
                          bar.style.background = '#10b981';
                          warn.classList.add('hidden');
                      }

                      renderTransactionsList();
                      renderReports();
                  }

                  function renderTransactionsList() {
                      const container = document.getElementById('tx-cards-container');
                      container.innerHTML = '';

                      const filtered = appData.transactions.filter(t => {
                          if (currentFilter === 'all') return true;
                          return t.type === currentFilter;
                      });

                      if (filtered.length === 0) {
                          container.innerHTML = '<div style="text-align:center; padding:28px 10px; color:#64748b; font-size:13px; font-weight:700;">لا توجد عمليات مسجلة في هذا القسم</div>';
                          return;
                      }

                      const reversed = [...filtered].reverse();
                      reversed.forEach(t => {
                          const item = document.createElement('div');
                          item.className = 'tx-card';
                          const isInc = t.type === 'income';
                          item.innerHTML = `
                              <div class="tx-right">
                                  <div class="tx-icon-bubble">${t.icon}</div>
                                  <div class="tx-meta">
                                      <span class="tx-name">${t.catName}</span>
                                      <span class="tx-subtext">${t.notes ? t.notes + ' • ' : ''}${t.date}</span>
                                  </div>
                              </div>
                              <div class="tx-left">
                                  <span class="tx-val ${isInc ? 'tx-green' : 'tx-red'}">
                                      ${isInc ? '+' : '-'}${formatMoney(t.amount)} ${appData.currency}
                                  </span>
                                  <button class="tx-del-btn" onclick="deleteTx(${t.id})">🗑️</button>
                              </div>
                          `;
                          container.appendChild(item);
                      });
                  }

                  function renderReports() {
                      const container = document.getElementById('reports-categories-list');
                      container.innerHTML = '';

                      let totalOut = 0;
                      const catTotals = {};

                      appData.transactions.forEach(t => {
                          if (t.type === 'expense') {
                              totalOut += Math.round(t.amount);
                              if (!catTotals[t.catId]) {
                                  catTotals[t.catId] = { name: t.catName, icon: t.icon, amount: 0 };
                              }
                              catTotals[t.catId].amount += Math.round(t.amount);
                          }
                      });

                      if (totalOut === 0) {
                          container.innerHTML = '<div style="text-align:center; padding:28px 10px; color:#64748b; font-size:13px; font-weight:700;">لا توجد مصاريف لتحليلها حتى الآن</div>';
                          return;
                      }

                      const sorted = Object.values(catTotals).sort((a, b) => b.amount - a.amount);
                      sorted.forEach(c => {
                          const pct = Math.round((c.amount / totalOut) * 100);
                          const card = document.createElement('div');
                          card.className = 'budget-box';
                          card.innerHTML = `
                              <div class="budget-meta">
                                  <span>${c.icon} ${c.name}</span>
                                  <span style="color:#10b981;">${formatMoney(c.amount)} ${appData.currency} (${pct}%)</span>
                              </div>
                              <div class="progress-rail">
                                  <div class="progress-bar-fill" style="width: ${pct}%; background:#10b981;"></div>
                              </div>
                          `;
                          container.appendChild(card);
                      });
                  }

                  function switchNav(tab) {
                      document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
                      document.querySelectorAll('.tab-pane').forEach(c => c.classList.add('hidden'));

                      document.getElementById('seg-' + tab).classList.add('active');
                      const target = document.getElementById('tab-' + tab);
                      target.classList.remove('hidden');
                      target.style.display = 'flex';
                  }

                  function setFilter(f, btn) {
                      currentFilter = f;
                      document.querySelectorAll('.f-chip').forEach(c => c.classList.remove('active'));
                      btn.classList.add('active');
                      renderTransactionsList();
                  }

                  function openAddModal() {
                      document.getElementById('add-modal').style.display = 'flex';
                      document.getElementById('tx-amount').value = '';
                      document.getElementById('tx-notes').value = '';
                      setType('expense');
                  }

                  function closeAddModal() {
                      document.getElementById('add-modal').style.display = 'none';
                  }

                  function openDesignerModal() {
                      document.getElementById('designer-modal').style.display = 'flex';
                  }

                  function closeDesignerModal() {
                      document.getElementById('designer-modal').style.display = 'none';
                  }

                  function setType(type) {
                      currentType = type;
                      const btnExp = document.getElementById('btn-type-exp');
                      const btnInc = document.getElementById('btn-type-inc');
                      const amountInput = document.getElementById('tx-amount');

                      if (type === 'expense') {
                          btnExp.className = 't-btn active-exp';
                          btnInc.className = 't-btn';
                          amountInput.style.color = '#ef4444';
                          renderCategories(expenseCategories);
                      } else {
                          btnInc.className = 't-btn active-inc';
                          btnExp.className = 't-btn';
                          amountInput.style.color = '#10b981';
                          renderCategories(incomeCategories);
                      }
                  }

                  function renderCategories(cats) {
                      const container = document.getElementById('cats-matrix');
                      container.innerHTML = '';
                      selectedCatId = cats[0].id;
                      cats.forEach(c => {
                          const div = document.createElement('div');
                          div.className = 'cat-tile ' + (c.id === selectedCatId ? 'selected' : '');
                          div.innerHTML = `<span>${c.icon}</span><span>${c.name}</span>`;
                          div.onclick = () => {
                              document.querySelectorAll('.cat-tile').forEach(k => k.classList.remove('selected'));
                              div.classList.add('selected');
                              selectedCatId = c.id;
                          };
                          container.appendChild(div);
                      });
                  }

                  function addPreset(val) {
                      const inp = document.getElementById('tx-amount');
                      const cur = Math.round(Number(inp.value)) || 0;
                      inp.value = cur + val;
                  }

                  function saveTransaction() {
                      const amount = Math.round(Number(document.getElementById('tx-amount').value));
                      if (isNaN(amount) || amount <= 0) {
                          alert('الرجاء إدخال مبلغ صحيح أكبر من الصفر');
                          return;
                      }

                      const cats = currentType === 'expense' ? expenseCategories : incomeCategories;
                      const catObj = cats.find(c => c.id === selectedCatId) || cats[0];
                      const notes = document.getElementById('tx-notes').value.trim();

                      const newTx = {
                          id: Date.now(),
                          type: currentType,
                          amount: amount,
                          catId: catObj.id,
                          catName: catObj.name,
                          icon: catObj.icon,
                          notes: notes,
                          date: new Date().toISOString().split('T')[0]
                      };

                      appData.transactions.push(newTx);
                      saveData();
                      closeAddModal();
                  }

                  function deleteTx(id) {
                      if (confirm('هل أنت متأكد من حذف هذه المعاملة؟')) {
                          appData.transactions = appData.transactions.filter(t => t.id !== id);
                          saveData();
                      }
                  }

                  function updateCurrency(val) {
                      appData.currency = val;
                      saveData();
                  }

                  function updateBudgetLimit(val) {
                      const b = Math.round(Number(val));
                      if (!isNaN(b) && b >= 0) {
                          appData.monthlyBudget = b;
                          saveData();
                      }
                  }

                  function exportDataReport() {
                      let txt = `📋 كشف حساب - محفظتي الذكية\n`;
                      txt += `الرصيد الإجمالي: ${document.getElementById('txt-balance').innerText} ${appData.currency}\n`;
                      txt += `---------------------------------\n`;
                      appData.transactions.forEach(t => {
                          const sign = t.type === 'income' ? '+' : '-';
                          txt += `${t.date} | ${t.catName}: ${sign}${formatMoney(t.amount)} ${appData.currency} ${t.notes ? '(' + t.notes + ')' : ''}\n`;
                      });

                      if (navigator.clipboard) {
                          navigator.clipboard.writeText(txt).then(() => {
                              alert('تم نسخ كشف الحساب كاملاً إلى الحافظة بنجاح!');
                          });
                      } else {
                          alert('تم إنشاء التقرير:\n' + txt);
                      }
                  }

                  function clearAllData() {
                      if (confirm('تحذير: هل أنت متأكد تماماً من حذف كافة الحركات المالية وتصفير الرصيد؟')) {
                          appData.transactions = [];
                          saveData();
                          alert('تم مسح البيانات بنجاح!');
                      }
                  }

                  // Initial setup
                  renderAll();
              </script>
          </body>
          </html>
          EOF

      - name: Build Gradle Wrapper
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Android APK
        run: |
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Smart-Wallet.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Wallet-APK
          path: Smart-Wallet.apk
